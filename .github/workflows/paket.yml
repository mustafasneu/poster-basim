name: Paket uret (Windows / macOS / Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  paket:
    # Releases'a dosya yuklemek icin gerekli; deponun varsayilan izni salt-okunur.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Linux tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Bagimliliklar
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller "pillow>=10" "reportlab>=4" "pypdfium2>=4" "pillow-heif>=0.16" "rawpy>=0.21" "tkinterdnd2>=0.4" onnxruntime

      - name: Paketi uret
        shell: bash
        run: bash paket_uret.sh

      - name: Paketi yukle
        uses: actions/upload-artifact@v7
        with:
          name: PosterBasim-${{ runner.os }}
          path: dist/
          if-no-files-found: warn

      - name: Etiketliyse Releases'a ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
